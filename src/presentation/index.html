<!-- src/presentation/index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Code Review AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Code Review AI</h2>

        <input id="url" placeholder="URL do commit ou MR" />
        <button id="btnAnalyzeCode">Analisar</button>
        <button id="btnConfig">⚙️ Configurações</button>

        <div class="language-selector">
            <label for="languageSelect">Linguagem:</label>
            <select id="languageSelect">
                <option value="javascript">📘 JavaScript</option>
                <option value="java">☕ Java</option>
                <option value="cpp">⚙️ C++</option>
                <option value="powerbuilder">🏗️ PowerBuilder</option>
            </select>
        </div>
        
        <div class="filters">
            Severidade:
                <select id="filterSeverity">
                    <option value="ALL">Todas</option>
                    <option value="HIGH">HIGH</option>
                    <option value="MEDIUM">MEDIUM</option>
                    <option value="LOW">LOW</option>
                </select>

            Tipo:
                <select id="filterType">
                    <option value="ALL">Todos</option>
                    <option value="BUG">BUG</option>
                    <option value="PERFORMANCE">PERFORMANCE</option>
                    <option value="SECURITY">SECURITY</option>
                    <option value="STYLE">STYLE</option>
                </select>
        </div>


        <div id="status"></div>

        <pre id="result"></pre>

        <script> 

            document.getElementById("btnAnalyzeCode").addEventListener("click", () => {
                analyze();
            });

            document.getElementById("btnConfig").addEventListener("click", () => {
                window.api.openConfig();
            });
            
            document.getElementById("filterSeverity").addEventListener("change", () => {
                if (lastResult) renderResult(lastResult);
            });

            document.getElementById("filterType").addEventListener("change", () => {
                if (lastResult) renderResult(lastResult);
            });

            
            async function analyze() {
                const url = document.getElementById('url').value.trim(); 
                const language = document.getElementById('languageSelect').value;
                const status = document.getElementById('status');
                const resultEl = document.getElementById('result');

                resultEl.innerText = "";

                // Validar URL antes de enviar
                try {
                    new URL(url);
                } catch {
                    status.innerText = "❌ URL inválida. Digite a URL completa (https://...)";
                    return;
                }

                // Validar se é GitHub ou GitLab
                if (!url.includes('github.com') && !url.includes('gitlab.com')&& !url.includes('gitlab.ciss.com')) {
                    status.innerText = "❌ Apenas GitHub e GitLab são suportados";
                    return;
                }

                status.innerText = "🔍 Coletando alterações...";

                try {
                    status.innerHTML = "⏳ Analisando código...";

                    const result = await window.api.analyzeCode({
                        url,
                        language,
                        type: "merge",
                        model: "gpt"
                    });

                    status.innerText = "✅ Análise concluída";

                    renderResult(result);

                } catch (err) {
                    status.innerText = "❌ Erro na análise";
                    console.error("Erro na análise:", err.message);
                }
            }

            function formatSuggestion(s) {
                return `💡 ${s.message} (${s.file}:${s.line ?? '-'})`;
            }

            function groupByFile(result) {
                const map = {};

                (result.issues || []).forEach(issue => {
                    if (!map[issue.file]) {
                        map[issue.file] = { issues: [], suggestions: [] };
                    }
                    map[issue.file].issues.push(issue);
                });

                (result.suggestions || []).forEach(s => {
                    if (!map[s.file]) {
                        map[s.file] = { issues: [], suggestions: [] };
                    }
                    map[s.file].suggestions.push(s);
                });

                return map;
            }

            let lastResult = null;

            function renderResult(result) {
                lastResult = result;

                const container = document.getElementById('result');
                container.innerHTML = "";

                const severityFilter = document.getElementById('filterSeverity').value;
                const typeFilter = document.getElementById('filterType').value;

                const grouped = groupByFile(result);

                Object.keys(grouped).forEach(file => {

                    const card = document.createElement("div");
                    card.className = "card";

                    const content = document.createElement("div");
                    content.className = "card-content";

                    const data = grouped[file];

                    const title = document.createElement("div");
                    title.className = "card-title";
                    
                    // Criar título de forma segura para evitar XSS
                    const fileName = document.createElement("span");
                    fileName.className = "file-name";
                    fileName.textContent = "📄 " + file;
                    
                    const fileMeta = document.createElement("span");
                    fileMeta.className = "file-meta";
                    fileMeta.textContent = data.issues.length + " problemas • " + data.suggestions.length + " sugestões";
                    
                    title.appendChild(fileName);
                    title.appendChild(fileMeta);

                    title.addEventListener("click", () => {
                        content.classList.toggle("hidden");
                    });

                    card.appendChild(title);
                    card.appendChild(content);

                    // HEADER ISSUES
                    const issueHeader = document.createElement("div");
                    issueHeader.innerText = "🚨 Problemas";
                    issueHeader.className = "section-title";
                    content.appendChild(issueHeader);

                    // Issues
                    data.issues
                        .filter(i =>
                            (severityFilter === "ALL" || i.severity === severityFilter) &&
                            (typeFilter === "ALL" || i.type === typeFilter)
                        )
                        .forEach(i => {

                            const item = document.createElement("div");
                            item.className = `issue ${i.severity}`;

                            // Criar elementos de forma segura para evitar XSS
                            const badge = document.createElement("span");
                            badge.className = `badge ${i.severity}`;
                            badge.textContent = i.severity;

                            const type = document.createElement("span");
                            type.className = "type";
                            type.textContent = i.type;

                            const message = document.createElement("span");
                            message.className = "message";
                            message.textContent = i.message;

                            const meta = document.createElement("span");
                            meta.className = "meta";
                            meta.textContent = `(${i.file}:${i.line ?? '-'})`;

                            item.appendChild(badge);
                            item.appendChild(type);
                            item.appendChild(message);
                            item.appendChild(meta);

                            content.appendChild(item); 
                        });

                    // HEADER SUGGESTIONS
                    const suggestionHeader = document.createElement("div");
                    suggestionHeader.innerText = "💡 Sugestões";
                    suggestionHeader.className = "section-title";
                    content.appendChild(suggestionHeader);

                    data.suggestions.forEach(s => {
                        const item = document.createElement("div");
                        item.className = "suggestion";
                        item.innerText = formatSuggestion(s);

                        content.appendChild(item); // ✅ corrigido
                    });

                    if (content.children.length > 2) {
                        container.appendChild(card);
                    }
                });
            }
        
            window.api.onProgress((message) => {
                document.getElementById('status').innerText = message;
            });
        
        </script>
    </div>
</body>
</html>
